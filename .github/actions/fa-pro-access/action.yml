name: Font Awesome Pro access
description: >-
  Lets `flutter pub get` resolve the private font-awesome-flutter-pro
  dependency by minting a short-lived GitHub App installation token and
  installing it as a git URL rewrite.

inputs:
  client-id:
    description: Client id of the GitHub App that can read the font repo
    required: true
  private-key:
    description: Private key of the GitHub App
    required: true

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@v3
      id: fa-pro-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: BoundfoxStudios
        repositories: font-awesome-flutter-pro
        permission-contents: read
    - run: git config --global url."https://x-access-token:${FA_PRO_TOKEN}@github.com/BoundfoxStudios/font-awesome-flutter-pro".insteadOf "https://github.com/BoundfoxStudios/font-awesome-flutter-pro"
      shell: bash
      env:
        FA_PRO_TOKEN: ${{ steps.fa-pro-token.outputs.token }}
