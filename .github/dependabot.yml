version: 2
registries:
  # The org-level "grant Dependabot access to private repositories" setting
  # does not reach pub's git clones, so the token is injected explicitly
  font-awesome-flutter-pro:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.FONT_AWESOME_PRO_REPO_GIT_TOKEN }}

updates:
  - package-ecosystem: pub
    directory: /app
    registries:
      - font-awesome-flutter-pro
    schedule:
      interval: weekly
    groups:
      pub-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: bundler
    directory: /app
    schedule:
      interval: monthly
    groups:
      bundler-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directories:
      - /
      # Composite actions are not covered by the root directory scan
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      github-actions-dependencies:
        patterns: ['*']
    commit-message:
      prefix: ci
