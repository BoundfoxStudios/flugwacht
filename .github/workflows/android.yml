name: Android

on:
  workflow_call:
    inputs:
      deliver:
        description: Upload the signed bundle to the Play internal testing track
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/fa-pro-access
        with:
          client-id: ${{ vars.BFS_APP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BFS_APP_BOT_PRIVATE_KEY }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: inputs.deliver
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app
      # key.properties is parsed as Java properties: backslashes, leading
      # whitespace, and non-ISO-8859-1 characters in the passwords would be
      # silently mangled — keep the secrets plain ASCII without backslashes
      - name: Write signing config
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=flugwacht"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter pub get
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: bundle exec fastlane android release
        if: inputs.deliver
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
