name: Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Rehearses the CD delivery builds (signed store artifacts) without uploading
# anything, so signing regressions surface on the PR instead of on main
jobs:
  build-android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  build-ios:
    uses: ./.github/workflows/ios.yml
    secrets: inherit
