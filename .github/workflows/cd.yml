name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deliver-latest-only: at most one queued run; a merge arriving while another
# is queued replaces it, so rapid merges deliver only the newest build
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deliver-android:
    # Guards manual dispatches: store builds only ever ship from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/create-github-app-token@v3
        id: fa-pro-token
        with:
          client-id: ${{ vars.BFS_APP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BFS_APP_BOT_PRIVATE_KEY }}
          owner: BoundfoxStudios
          repositories: font-awesome-flutter-pro
          permission-contents: read
      - run: git config --global url."https://x-access-token:${FA_PRO_TOKEN}@github.com/BoundfoxStudios/font-awesome-flutter-pro".insteadOf "https://github.com/BoundfoxStudios/font-awesome-flutter-pro"
        env:
          FA_PRO_TOKEN: ${{ steps.fa-pro-token.outputs.token }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app/android
      # key.properties is parsed as Java properties: backslashes, leading
      # whitespace, and non-ISO-8859-1 characters in the passwords would be
      # silently mangled — keep the secrets plain ASCII without backslashes
      - name: Write signing config
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=flugwacht"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter pub get
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: bundle exec fastlane android release
        working-directory: app/android
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}

  deliver-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/create-github-app-token@v3
        id: fa-pro-token
        with:
          client-id: ${{ vars.BFS_APP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BFS_APP_BOT_PRIVATE_KEY }}
          owner: BoundfoxStudios
          repositories: font-awesome-flutter-pro
          permission-contents: read
      - run: git config --global url."https://x-access-token:${FA_PRO_TOKEN}@github.com/BoundfoxStudios/font-awesome-flutter-pro".insteadOf "https://github.com/BoundfoxStudios/font-awesome-flutter-pro"
        env:
          FA_PRO_TOKEN: ${{ steps.fa-pro-token.outputs.token }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app/ios
      - name: Write signing inputs
        run: |
          printf '%s' "$APPLE_CERTIFICATE_DATA" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_APP_STORE_CONNECT_KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_CERTIFICATE_DATA: ${{ secrets.APPLE_CERTIFICATE_DATA }}
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
      - run: flutter pub get
      - run: flutter build ios --release --config-only --build-number=${{ github.run_number }}
      - run: bundle exec fastlane ios release
        working-directory: app/ios
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_PASSPHRASE: ${{ secrets.APPLE_CERTIFICATE_PASSPHRASE }}
