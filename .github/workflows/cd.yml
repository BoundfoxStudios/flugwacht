name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deliver-latest-only: at most one queued run; a merge arriving while another
# is queued replaces it, so rapid merges deliver only the newest build
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deliver-android:
    uses: ./.github/workflows/android.yml
    with:
      deliver: true
    secrets: inherit

  deliver-ios:
    uses: ./.github/workflows/ios.yml
    with:
      deliver: true
    secrets: inherit
