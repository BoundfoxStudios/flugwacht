name: Website Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Per-commit groups for pushes so queued main runs are never canceled as superseded
  group: website-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.areas.outputs.website }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/changed-areas
        id: areas

  website-checks:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      # The build never talks to the private registry, only the install does
      - run: npm ci
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
      - run: npm run format:check
      # i18nMissingTranslation is an error, so this fails on a missing German string
      - run: npm run build
