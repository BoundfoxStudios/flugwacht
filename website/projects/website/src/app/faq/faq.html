<section id="faq" class="border-b border-neutral-200 bg-neutral-50">
  <div class="mx-auto flex max-w-4xl flex-col gap-8 px-8 py-18">
    <bfs-fw-section-head heading="FAQ." i18n-heading="@@faq.heading" />

    <div class="flex flex-col gap-4">
      @for (entry of entries; track entry.question) {
        <div class="flex flex-col gap-1.5 rounded-xl border border-neutral-200 bg-white p-6">
          <!-- The design styles the question in body type, against the Bebas-uppercase default every heading otherwise gets. -->
          <h3 class="font-sans text-lg leading-normal font-semibold normal-case text-neutral-800">
            {{ entry.question }}
          </h3>
          <p class="text-base leading-relaxed text-neutral-600">{{ entry.answer }}</p>
        </div>
      }
    </div>
  </div>
</section>
