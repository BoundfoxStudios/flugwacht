<footer class="bg-neutral-800">
  <div class="mx-auto flex max-w-6xl flex-col gap-9 px-5 pt-14 pb-7 sm:px-8">
    <div class="flex flex-wrap justify-between gap-10">
      <div class="flex max-w-80 flex-col gap-3">
        <div class="flex items-center gap-2.5">
          <bfs-fw-logo variant="dark" class="block size-6" />
          <span class="font-display text-2xl tracking-wider text-neutral-50">FLUGWACHT</span>
        </div>
        <p class="text-sm leading-relaxed text-neutral-400" i18n="@@footer.tagline">
          A simple flight tracker for friends and family.
        </p>
      </div>

      <div class="flex flex-wrap gap-16">
        <div class="flex flex-col gap-2.5">
          <span
            class="font-display text-base tracking-wider text-neutral-500"
            i18n="@@footer.getTheApp"
            >GET THE APP</span
          >
          <!-- The padding lifts each link to a 44px target; the stack's negative margin keeps the
               column's outer spacing exactly as designed. -->
          <div class="-my-3 flex flex-col">
            <a
              href="https://apps.apple.com/us/app/flugwacht/id6801012878"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              >App Store</a
            >
            <a
              href="https://play.google.com/store/apps/details?id=com.boundfoxstudios.apps.flugwacht"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              >Google Play</a
            >
          </div>
        </div>

        <div class="flex flex-col gap-2.5">
          <span
            class="font-display text-base tracking-wider text-neutral-500"
            i18n="@@footer.community"
            >COMMUNITY</span
          >
          <div class="-my-3 flex flex-col">
            <a
              href="https://github.com/BoundfoxStudios/flugwacht"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              >GitHub</a
            >
            <a
              href="https://discord.gg/tHqNzMT"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              >Discord</a
            >
          </div>
        </div>

        <div class="flex flex-col gap-2.5">
          <span class="font-display text-base tracking-wider text-neutral-500" i18n="@@footer.legal"
            >LEGAL</span
          >
          <div class="-my-3 flex flex-col">
            <a
              href="https://boundfoxstudios.com/legal-details-imprint"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              i18n="@@footer.imprint"
              >Imprint</a
            >
            <a
              href="https://boundfoxstudios.com/privacy-policy"
              target="_blank"
              rel="noopener"
              class="flex items-center py-3 text-sm text-neutral-300 no-underline hover:text-white"
              i18n="@@footer.privacy"
              >Privacy Policy</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 border-t border-neutral-700 pt-5">
      <span class="text-sm text-neutral-500">© 2026 Boundfox Studios · flugwacht.app</span>
      <a
        href="https://boundfoxstudios.com"
        target="_blank"
        rel="noopener"
        class="-my-2.5 flex items-center gap-2 py-2.5 no-underline"
      >
        <img src="/images/fox-head.png" alt="" class="size-6 object-contain" />
        <span class="text-sm text-neutral-400" i18n="@@footer.boundfoxProject"
          >A Boundfox Studios project</span
        >
      </a>
      <span class="text-sm text-neutral-500" i18n="@@footer.mapData"
        >Map data © OpenStreetMap contributors</span
      >
    </div>
  </div>
</footer>
