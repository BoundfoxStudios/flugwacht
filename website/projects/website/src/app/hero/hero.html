<section
  id="top"
  class="mx-auto flex max-w-6xl flex-col items-center gap-16 px-8 pt-16 pb-20 lg:flex-row"
>
  <div class="flex flex-1 flex-col gap-5">
    <span
      class="self-start rounded-full bg-brand-yellow px-3 py-1 text-xs font-semibold tracking-wider text-neutral-800"
      i18n="@@hero.badge"
      >FREE &amp; OPEN SOURCE</span
    >

    <h1 class="text-pretty text-5xl text-neutral-800 lg:text-7xl" i18n="@@hero.title">
      Simply track your <br />friends' flights.
    </h1>

    <p class="max-w-110 text-pretty text-lg leading-relaxed text-neutral-600" i18n="@@hero.teaser">
      Flugwacht is a minimal flight tracker for the flights you actually care about. No account, no
      ads, everything stays on your device. The flight data comes from community-run ADS-B networks.
    </p>

    <div class="mt-2 flex flex-wrap items-center gap-4">
      <a
        href="https://apps.apple.com/us/app/flugwacht/id6801012878"
        target="_blank"
        rel="noopener"
        class="flex items-center no-underline"
      >
        <img
          [src]="appStoreBadge"
          alt="Download on the App Store"
          i18n-alt="@@hero.appStoreAlt"
          class="block h-13 w-auto"
        />
      </a>
      <a
        href="https://play.google.com/store/apps/details?id=com.boundfoxstudios.apps.flugwacht"
        target="_blank"
        rel="noopener"
        class="flex items-center no-underline"
      >
        <img
          [src]="playStoreBadge"
          alt="Get it on Google Play"
          i18n-alt="@@hero.playStoreAlt"
          class="-my-1 block h-16 w-auto"
        />
      </a>
    </div>
  </div>

  <div class="relative flex-none px-10 pt-6">
    <svg
      width="360"
      height="120"
      viewBox="0 0 360 120"
      class="pointer-events-none absolute -top-3.5 -left-11 hidden lg:block"
      aria-hidden="true"
    >
      <path
        d="M10 100C90 40 250 70 350 14"
        fill="none"
        stroke-width="2"
        stroke-dasharray="7 6"
        opacity="0.7"
        class="stroke-brand-accent"
      />
      <circle cx="10" cy="100" r="4" class="fill-brand-accent" />
    </svg>

    <div class="h-144 w-70 rounded-4xl bg-neutral-900 p-2 shadow-2xl">
      <div class="size-full overflow-hidden rounded-3xl bg-neutral-800"></div>
    </div>
  </div>
</section>
