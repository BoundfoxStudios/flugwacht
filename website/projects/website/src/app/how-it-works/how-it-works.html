<section id="how" class="relative overflow-hidden bg-neutral-800">
  <svg
    width="100%"
    height="100%"
    viewBox="0 0 1280 420"
    preserveAspectRatio="xMidYMid slice"
    class="pointer-events-none absolute inset-0"
    aria-hidden="true"
  >
    <path
      d="M-40 380C300 300 640 340 900 220S1200 80 1330 30"
      fill="none"
      stroke-width="2"
      stroke-dasharray="8 7"
      class="stroke-neutral-700"
    />
  </svg>

  <div class="relative mx-auto flex max-w-6xl flex-col gap-10 px-8 py-18">
    <bfs-fw-section-head heading="How it works." i18n-heading="@@how.heading" onDark />

    <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
      @for (step of steps; track step.number) {
        <div class="flex flex-col gap-3">
          <span class="font-display text-5xl leading-none text-brand-accent">{{ step.number }}</span>
          <h3 class="text-2xl tracking-wide text-white">{{ step.title }}</h3>
          <p class="text-base leading-relaxed text-neutral-400">{{ step.text }}</p>
        </div>
      }
    </div>
  </div>
</section>
