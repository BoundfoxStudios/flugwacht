<section class="bg-linear-to-r from-brand-yellow to-brand-orange">
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-8 px-5 sm:px-8 py-14"
  >
    <div class="flex flex-col gap-2">
      <h2 class="text-5xl text-neutral-800" i18n="@@openSource.heading">
        Flugwacht is open source.
      </h2>
      <p class="max-w-130 text-base leading-relaxed text-neutral-700" i18n="@@openSource.text">
        Flugwacht is open source. Read the code, file an issue or build it yourself.
      </p>
    </div>

    <a
      href="https://github.com/BoundfoxStudios/flugwacht"
      target="_blank"
      rel="noopener"
      class="flex flex-none items-center gap-3 rounded-xl bg-neutral-900 px-6 py-4 text-white no-underline"
    >
      <fa-icon [icon]="['fab', 'github']" class="text-2xl" />
      <span class="text-base font-semibold">boundfoxstudios/flugwacht</span>
    </a>
  </div>
</section>
