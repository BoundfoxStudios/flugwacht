<section class="mx-auto flex max-w-6xl flex-col gap-10 px-5 sm:px-8 py-18">
  <bfs-fw-section-head heading="A look at the app." i18n-heading="@@screenshots.heading" centered />

  <div class="flex flex-wrap justify-center gap-12">
    @for (caption of captions; track caption) {
      <div class="flex flex-col items-center gap-4">
        <div class="h-122 w-60 rounded-3xl bg-neutral-900 p-2 shadow-xl">
          <div class="size-full overflow-hidden rounded-2xl bg-neutral-800"></div>
        </div>
        <span class="text-sm font-semibold text-neutral-600">{{ caption }}</span>
      </div>
    }
  </div>
</section>
